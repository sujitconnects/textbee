services:

  textbee-api:

    build:
      context: ./api
      dockerfile: Dockerfile

    restart: always

    expose:
      - "3001"

    environment:
      PORT: 3001
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      FRONTEND_URL: ${FRONTEND_URL}

      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_PRIVATE_KEY_ID: ${FIREBASE_PRIVATE_KEY_ID}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_CLIENT_ID: ${FIREBASE_CLIENT_ID}
      FIREBASE_CLIENT_C509_CERT_URL: ${FIREBASE_CLIENT_C509_CERT_URL}

      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO}
      ADMIN_EMAIL: ${ADMIN_EMAIL}

      WEBHOOK_DELIVERY_TIMEOUT_MS: ${WEBHOOK_DELIVERY_TIMEOUT_MS}
      WEBHOOK_AUTO_DISABLE_FAILURE_THRESHOLD: ${WEBHOOK_AUTO_DISABLE_FAILURE_THRESHOLD}
      WEBHOOK_AUTO_DISABLE_LOOKBACK_DAYS: ${WEBHOOK_AUTO_DISABLE_LOOKBACK_DAYS}
      WEBHOOK_AUTO_DISABLE_MIN_FAILURE_RATE: ${WEBHOOK_AUTO_DISABLE_MIN_FAILURE_RATE}

      USE_SMS_QUEUE: ${USE_SMS_QUEUE}
      REDIS_URL: redis://textbee-redis:6379

      MAX_SMS_BATCH_SIZE: ${MAX_SMS_BATCH_SIZE}
      BULK_DISPATCH_WINDOW: ${BULK_DISPATCH_WINDOW}
      BULK_DISPATCH_MAX_SPREAD_HOURS: ${BULK_DISPATCH_MAX_SPREAD_HOURS}

      FCM_SMS_TTL_SECONDS: ${FCM_SMS_TTL_SECONDS}
      FCM_HEARTBEAT_TTL_SECONDS: ${FCM_HEARTBEAT_TTL_SECONDS}

      FCM_SEND_SKIP_USER_IDS: ${FCM_SEND_SKIP_USER_IDS}
      FCM_SEND_SKIP_DEVICE_IDS: ${FCM_SEND_SKIP_DEVICE_IDS}

      SEND_SCHEDULER_V2_ENABLED: ${SEND_SCHEDULER_V2_ENABLED}
      RECOVERY_POLL_ENABLED: ${RECOVERY_POLL_ENABLED}
      UPDATE_NOTIFICATIONS_ENABLED: ${UPDATE_NOTIFICATIONS_ENABLED}

      LATEST_APP_VERSION_CODE: ${LATEST_APP_VERSION_CODE}
      LATEST_APP_VERSION_NAME: ${LATEST_APP_VERSION_NAME}

      CLOUDFLARE_TURNSTILE_SECRET_KEY: ${CLOUDFLARE_TURNSTILE_SECRET_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      TRUSTED_PROXY: ${TRUSTED_PROXY}
      ACCESS_FOOTPRINTS: ${ACCESS_FOOTPRINTS}
      LIMIT_EXEMPT_USER_IDS: ${LIMIT_EXEMPT_USER_IDS}
      RECEIVE_SMS_OVER_LIMIT: ${RECEIVE_SMS_OVER_LIMIT}
      RECEIVED_WEBHOOK_MAX_AGE_HOURS: ${RECEIVED_WEBHOOK_MAX_AGE_HOURS}

      ANALYTICS_PROVIDERS: ${ANALYTICS_PROVIDERS}
      META_PIXEL_ID: ${META_PIXEL_ID}
      META_CAPI_ACCESS_TOKEN: ${META_CAPI_ACCESS_TOKEN}
      META_CAPI_TEST_EVENT_CODE: ${META_CAPI_TEST_EVENT_CODE}

      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN}
      POLAR_SERVER: ${POLAR_SERVER}
      POLAR_WEBHOOK_SECRET: ${POLAR_WEBHOOK_SECRET}
      POLAR_ORGANIZATION_ID: ${POLAR_ORGANIZATION_ID}
      POLAR_DEFAULT_DISCOUNT_ID: ${POLAR_DEFAULT_DISCOUNT_ID}

    depends_on:
      textbee-redis:
        condition: service_healthy

    networks:
      - textbee-network
      - dokploy-network


  textbee-web:

    build:
      context: ./web
      dockerfile: Dockerfile

    restart: always

    expose:
      - "3000"

    environment:
      PORT: 3000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NEXT_PUBLIC_LATEST_APP_VERSION_CODE: ${NEXT_PUBLIC_LATEST_APP_VERSION_CODE}
      NEXT_PUBLIC_LATEST_APP_VERSION_NAME: ${NEXT_PUBLIC_LATEST_APP_VERSION_NAME}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}

      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
      MAIL_FROM: ${MAIL_FROM}
      ADMIN_EMAIL: ${ADMIN_EMAIL}

      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
      NEXT_PUBLIC_BULK_RECIPIENT_WARN_THRESHOLD: ${NEXT_PUBLIC_BULK_RECIPIENT_WARN_THRESHOLD}

      NEXT_PUBLIC_ANALYTICS_PROVIDERS: ${NEXT_PUBLIC_ANALYTICS_PROVIDERS}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID}
      NEXT_PUBLIC_CLARITY_PROJECT_ID: ${NEXT_PUBLIC_CLARITY_PROJECT_ID}
      NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID}

      NEXT_PUBLIC_ATTRIBUTION_COOKIE_DOMAIN: ${NEXT_PUBLIC_ATTRIBUTION_COOKIE_DOMAIN}

      NEXT_PUBLIC_SUPPORT_HQ_PROJECT_ID: ${NEXT_PUBLIC_SUPPORT_HQ_PROJECT_ID}
      NEXT_PUBLIC_SUPPORT_HQ_THEME_COLOR: ${NEXT_PUBLIC_SUPPORT_HQ_THEME_COLOR}

      NEXT_PUBLIC_DISCOUNT_PERCENTAGE: ${NEXT_PUBLIC_DISCOUNT_PERCENTAGE}
      NEXT_PUBLIC_DISCOUNT_CODE: ${NEXT_PUBLIC_DISCOUNT_CODE}

    depends_on:
      - textbee-api

    networks:
      - textbee-network
      - dokploy-network


  textbee-redis:

    image: redis:alpine

    restart: always

    volumes:
      - redis_data:/data

    networks:
      - textbee-network

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s


networks:
  textbee-network:
    driver: bridge
  dokploy-network:
    external: true


volumes:
  redis_data: